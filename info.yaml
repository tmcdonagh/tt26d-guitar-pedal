# Tiny Tapeout project information
project:
  title:        "Silicon Guitar Pedal"        # Project title
  author:       "Thomas McDonagh"      # Your name
  discord:      "dedicatedhippo"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "I2S serial-effect guitar pedal — 6-slot chain comp, fuzz, distortion, phaser, trem, delay (Rev A: comp/phaser/delay are identity stubs) with DIP-switch enables on ui[6:1]; true bypass is wired externally via a 3PDT switch" # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     24576000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tmcdonagh_guitar_pedal"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_tmcdonagh_guitar_pedal.v"
    - "mult.v"
    - "knob_rc.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "I2S ADC data in"
  ui[1]: "Enable: comp"
  ui[2]: "Enable: fuzz"
  ui[3]: "Enable: dist"
  ui[4]: "Enable: phaser"
  ui[5]: "Enable: trem"
  ui[6]: "Reserved"
  ui[7]: "Fuzz octave switch"

  # Outputs
  uo[0]: "Reserved SPI SCK"
  uo[1]: "Reserved SPI CS (idle high)"
  uo[2]: "Reserved SPI MOSI"
  uo[3]: "Reserved (Rev B)"
  uo[4]: "Reserved (Rev B)"
  uo[5]: "Reserved (Rev B)"
  uo[6]: "Reserved (Rev B)"
  uo[7]: "dp = clip LED (peak hold ~43 ms)"

  # Bidirectional pins
  uio[0]: "MCLK (24.576 MHz output)"
  uio[1]: "I2S DAC data out"
  uio[2]: "Knob K1 trem rate (RC)"
  uio[3]: "Knob K2 tone (RC)"
  uio[4]: "Knob K3 drive (RC)"
  uio[5]: "Reserved (SPI MISO)"
  uio[6]: "I2S BCLK (master, 3.072 MHz)"
  uio[7]: "I2S LRCLK/WS (master, 48 kHz)"

# Do not change!
yaml_version: 6
